name: Бэктест за год

on:
  workflow_dispatch:           # запуск кнопкой
    inputs:
      days:
        description: "Сколько дней истории проверять"
        default: "365"
  schedule:
    - cron: "17 6 * * 1"       # и автоматически каждый понедельник утром

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Бэктест
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python backtest.py --days ${{ github.event.inputs.days || '365' }} --telegram
      - name: Сохранить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: reports/
