name: Бот каждые 10 минут

on:
  schedule:
    # Каждые 10 минут на «тихих» минутах. На :00/:15/:30/:45 у GitHub пик нагрузки,
    # запуски там задерживаются и теряются. Время UTC.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:            # кнопка ручного запуска (и для внешнего будильника)

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Память бота: алерты, дневник сделок, что уже отправлено
      - name: Восстановить состояние
        uses: actions/cache/restore@v4
        with:
          path: state
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: Команды, алерты, сканер, сигналы, сводка
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python run.py

      - name: Сохранить состояние
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: bot-state-${{ github.run_id }}
