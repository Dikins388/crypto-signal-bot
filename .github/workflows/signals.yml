name: Сигналы каждые 15 минут

on:
  schedule:
    - cron: "*/15 * * * *"     # время UTC; GitHub может запускать с опозданием на несколько минут
  workflow_dispatch:            # кнопка ручного запуска во вкладке Actions

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Память бота о уже отправленных сигналах, чтобы не присылать одно и то же дважды
      - name: Восстановить состояние
        uses: actions/cache/restore@v4
        with:
          path: state
          key: signal-state-${{ github.run_id }}
          restore-keys: signal-state-

      - name: Проверить рынок и отправить сигналы
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python live.py

      - name: Сохранить состояние
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: signal-state-${{ github.run_id }}
